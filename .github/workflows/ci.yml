name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the cluster test
        working-directory: test/cluster
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      # A container can't load kernel modules, so the runner loads the ones Kubernetes needs.
      - run: sudo modprobe -a br_netfilter overlay
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Rootless Podman doesn't hand containers the cpuset cgroup the kubelet needs.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-kubeadm kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready node --all --timeout=3m
      # kubeadm init used the example's join token, so the cluster has it,
      # but neither it nor the certificate key may be in state.
      - name: Check the join token and certificate key stayed out of state
        working-directory: examples/local
        run: |
          sudo podman exec circuit-kubeadm kubeadm token list --kubeconfig /etc/kubernetes/admin.conf | grep -q '^abcdef\.'
          if grep -qE 'abcdef\.0123456789abcdef|0123456789abcdef|0{64}' terraform.tfstate; then
            echo "The join token or certificate key is in terraform.tfstate." >&2
            exit 1
          fi
      # Restarting the container boots systemd again, so this checks the
      # kubelet brings the control plane back by itself, the API answers,
      # the node is Ready again, and the plan has nothing to do.
      - name: Restart the host, then check the cluster and the plan
        working-directory: examples/local
        run: |
          sudo podman restart circuit-kubeadm
          for _ in $(seq 60); do
            case $(sudo podman exec circuit-kubeadm systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          for _ in $(seq 180); do
            sudo podman exec circuit-kubeadm kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /readyz >/dev/null 2>&1 && break
            sleep 1
          done
          sudo podman exec circuit-kubeadm kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /readyz
          sudo podman exec circuit-kubeadm kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready node --all --timeout=3m
          conn3x plan -detailed-exitcode
      - name: Show the kubelet and containerd logs
        if: failure()
        run: |
          sudo podman exec circuit-kubeadm sh -c 'systemctl --no-pager status kubelet containerd; journalctl --no-pager -u kubelet -u containerd | tail -n 80; crictl --runtime-endpoint unix:///run/containerd/containerd.sock ps -a' || true
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh

  cluster:
    needs: validate
    runs-on: ubuntu-24.04
    name: cluster (control plane and worker)
    env:
      PODMAN: sudo podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - run: sudo modprobe -a br_netfilter overlay
      - name: Start two Ubuntu 24.04 hosts
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/ubuntu2404/Containerfile
        run: |
          for n in 1 2; do
            CONTAINER_NAME=kube-n$n PORT=222$n examples/local/up.sh
            cat examples/local/known_hosts >> test/cluster/known_hosts
          done
          cp examples/local/id_ed25519 test/cluster/
          echo "TF_VAR_cp_ip=$(sudo podman inspect -f '{{.NetworkSettings.IPAddress}}' kube-n1)" >> "$GITHUB_ENV"
      - name: Apply, then plan again with no changes
        working-directory: test/cluster
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Check both nodes are Ready
        run: |
          sum=$(sed -n '/cni_manifest_sha256/,/^}/s/.*default *= *"\(.*\)"/\1/p' variables.tf)
          echo "$sum  /etc/conn3x/kubeadm/cni.yaml" | sudo podman exec -i kube-n1 sha256sum -c -
          sudo podman exec kube-n1 kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready node --all --timeout=3m
      - name: Clean up
        if: always()
        run: for n in 1 2; do CONTAINER_NAME=kube-n$n examples/local/down.sh; done
